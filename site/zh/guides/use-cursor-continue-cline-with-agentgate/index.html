<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Cursor / Continue / Cline 接入 MuxLayer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../../../assets/tailwind.css" />
</head>
<body class="bg-slate-950 text-slate-100 p-8 max-w-3xl mx-auto">
  <h1 class="text-2xl font-bold mb-4">用 Cursor / Continue / Cline 接入 MuxLayer</h1>
  <p class="mb-4 text-slate-300">把任意 OpenAI 兼容编辑器指向本机 MuxLayer 网关。</p>
  <ul class="list-disc pl-6 space-y-2 text-slate-200">
    <li>Base URL：<code class="text-amber-300">http://127.0.0.1:9090/v1</code></li>
    <li>API key：MuxLayer 本地 token（<code>ag_local_…</code>）</li>
    <li>Chat：<code>/v1/chat/completions</code> · Responses：<code>/v1/responses</code></li>
  </ul>
  <p class="mt-6 text-sm text-slate-400">完整步骤见 <a class="text-amber-400 underline" href="https://github.com/dengmengmian/muxlayer/blob/main/docs/use-cursor-continue-cline-with-agentgate-zh.md">文档</a></p>
</body>
</html>
